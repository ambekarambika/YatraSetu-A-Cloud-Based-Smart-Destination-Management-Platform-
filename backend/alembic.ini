# ==============================================================================
# YatraSetu — Alembic Migration Configuration
# ==============================================================================

[alembic]
# Path to migration environment scripts
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with backend directory so app modules can be imported
prepend_sys_path = .

# Timezone for revision timestamps
timezone = UTC

# Version locations
version_locations = alembic/versions

# Fallback sqlalchemy.url (overridden dynamically by env.py from app.config.settings.DATABASE_URL)
sqlalchemy.url = postgresql://postgres:postgres@localhost/yatrasetu_db

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
